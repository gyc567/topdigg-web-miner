name: Deploy to Vercel Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Vercel
        run: |
          # --wait=false: CLI returns immediately after triggering deploy.
          # Vercel continues building; monitor via API or Vercel dashboard.
          npx vercel@latest deploy --prod --yes --wait=false
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
