name: Deploy to Vercel Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 增量 prerender 缓存：key 用 run_id 保证每次都上传；
      # restore-keys 前缀匹配上一次运行的缓存。路由级失效由
      # scripts/lib/prerender-cache.mjs 的 hash 决定，与 actions/cache 的 key 无关。
      - name: Restore prerender cache
        uses: actions/cache@v4
        with:
          path: .prerender-cache
          key: prerender-v1-${{ github.run_id }}
          restore-keys: |
            prerender-v1-

      # 拉取项目设置（.vercel/project.json 未入库，CI 需要显式提供 org/project id）
      - name: Pull Vercel environment
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_CrV6muN0s3QNDJ3vrabttjLR
          VERCEL_PROJECT_ID: prj_5vnaBgPn0LKiEBPxWzhKSICpWUAS

      # vercel build 执行 vercel.json 里的 buildCommand（npm run build，含 prerender），
      # 并打包为 .vercel/output 供 --prebuilt 上传，避免 Vercel 端二次构建。
      - name: Build Project
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_ENV: production
          VERCEL_ORG_ID: team_CrV6muN0s3QNDJ3vrabttjLR
          VERCEL_PROJECT_ID: prj_5vnaBgPn0LKiEBPxWzhKSICpWUAS

      - name: Deploy to Vercel
        run: |
          # --prebuilt: upload the already-built .vercel/output without triggering
          # a server-side rebuild. This avoids the 20+ min Chromium prerender
          # on Vercel's infrastructure.
          # NOTE: do NOT use --no-wait; it masks deploy failures causing CI to report
          # success while Vercel serves stale content from its edge cache.
          DEPLOYMENT_URL=$(npx vercel@latest deploy --prod --yes --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployment URL: $DEPLOYMENT_URL"

          # Poll until deployment is ready (up to 5 minutes)
          for i in $(seq 1 30); do
            STATUS=$(npx vercel@latest inspect "$DEPLOYMENT_URL" --token=${{ secrets.VERCEL_TOKEN }} | grep -E '"state"|"ready"|"error"' | head -1)
            echo "Check $i: $STATUS"
            if echo "$STATUS" | grep -q "READY"; then
              echo "✅ Deployment is live"
              break
            elif echo "$STATUS" | grep -q "ERROR"; then
              echo "❌ Deployment failed"
              exit 1
            fi
            sleep 10
          done

          # Verify money-lab is in the deployed index.html
          curl -s "$DEPLOYMENT_URL/" | grep -q "money-lab" && echo "✅ money-lab nav verified in deployment" || { echo "❌ money-lab nav NOT found in deployment"; exit 1; }
        env:
          VERCEL_ORG_ID: team_CrV6muN0s3QNDJ3vrabttjLR
          VERCEL_PROJECT_ID: prj_5vnaBgPn0LKiEBPxWzhKSICpWUAS
