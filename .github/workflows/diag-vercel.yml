name: DIAG Vercel Scope

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe scope options
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          h() { echo "--- $1 ---"; curl -s -o /tmp/r.json -w "http=%{http_code}\n" -H "Authorization: Bearer $VERCEL_TOKEN" "$2"; head -c 700 /tmp/r.json; echo; echo; }

          h "GET /v2/user (defaultTeamId)" "https://api.vercel.com/v2/user"
          h "GET /v2/user?teamId=\$VERCEL_ORG_ID" "https://api.vercel.com/v2/user?teamId=$VERCEL_ORG_ID"
          h "GET /v2/teams/\$VERCEL_ORG_ID" "https://api.vercel.com/v2/teams/$VERCEL_ORG_ID"
          h "GET /v9/projects?limit=20 (list accessible)" "https://api.vercel.com/v9/projects?limit=20"
          h "GET /v6/projects?limit=20" "https://api.vercel.com/v6/projects?limit=20"
          h "GET /v9/projects/\$VERCEL_PROJECT_ID?teamId=org" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          h "GET /v2/teams?limit=20 (raw)" "https://api.vercel.com/v2/teams?limit=20"
