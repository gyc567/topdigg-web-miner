    <script>
        function showSuccessMessage(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = message;
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);
        }

        async function copySVGAsImage() {
            try {
                const svg = document.querySelector('svg');
                const svgData = new XMLSerializer().serializeToString(svg);
                
                // Create canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Set high resolution for better quality
                const scale = 3;
                canvas.width = 750 * scale;
                canvas.height = 1334 * scale;
                ctx.scale(scale, scale);
                
                // Create image from SVG
                const img = new Image();
                const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                
                img.onload = async function() {
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    
                    // Convert to blob and copy to clipboard
                    canvas.toBlob(async function(blob) {
                        try {
                            await navigator.clipboard.write([
                                new ClipboardItem({
                                    'image/png': blob
                                })
                            ]);
                            showSuccessMessage('✅ 图片已复制到剪贴板，可直接粘贴到社交平台！');
                        } catch (err) {
                            console.error('复制失败:', err);
                            showSuccessMessage('❌ 复制失败，请尝试下载图片');
                        }
                    }, 'image/png', 1.0);
                };
                
                img.src = url;
            } catch (err) {
                console.error('生成图片失败:', err);
                showSuccessMessage('❌ 生成图片失败，请重试');
            }
        }

        function copySVGCode() {
            try {
                const svg = document.querySelector('svg');
                const svgData = new XMLSerializer().serializeToString(svg);
                
                navigator.clipboard.writeText(svgData).then(() => {
                    showSuccessMessage('✅ SVG代码已复制到剪贴板！');
                }).catch(err => {
                    console.error('复制失败:', err);
                    showSuccessMessage('❌ 复制失败，请手动选择代码');
                });
            } catch (err) {
                console.error('复制SVG代码失败:', err);
                showSuccessMessage('❌ 复制失败，请重试');
            }
        }

        function downloadSVG() {
            try {
                const svg = document.querySelector('svg');
                const svgData = new XMLSerializer().serializeToString(svg);
                
                // Create canvas for high quality PNG
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Set high resolution
                const scale = 3;
                canvas.width = 750 * scale;
                canvas.height = 1334 * scale;
                ctx.scale(scale, scale);
                
                const img = new Image();
                const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                
                img.onload = function() {
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    
                    // Download as PNG
                    canvas.toBlob(function(blob) {
                        const downloadUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = 'hitem3d-knowledge-card.png';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(downloadUrl);
                        showSuccessMessage('✅ 图片已下载到本地！');
                    }, 'image/png', 1.0);
                };
                
                img.src = url;
            } catch (err) {
                console.error('下载失败:', err);
                showSuccessMessage('❌ 下载失败，请重试');
            }
        }

        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.copy-btn');
            buttons.forEach(button => {
                button.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-2px)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                });
            });
