    <script>
        function showSuccessMessage(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = message;
            successMsg.classList.add('show');

                successMsg.classList.remove('show');
            }, 3000);
        }

        async function copySVGAsImage() {
            try {
                const svg = document.querySelector('svg');
                const svgData = new XMLSerializer().serializeToString(svg);
                
                // Create canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Set high resolution for better quality
                const scale = 3;
                const svgWidth = 750;
                const svgHeight = 1334;
                
                canvas.width = svgWidth * scale;
                canvas.height = svgHeight * scale;
                
                // Set white background to ensure proper rendering
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Scale context for high resolution
                ctx.scale(scale, scale);
                
                // Create image from SVG
                const img = new Image();
                img.width = svgWidth;
                img.height = svgHeight;
                
                const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                
                img.onload = async function() {
                    // Draw image with explicit dimensions to ensure proper scaling
                    ctx.drawImage(img, 0, 0, svgWidth, svgHeight);
                    URL.revokeObjectURL(url);
                    
                    // Convert to blob and copy to clipboard
                    canvas.toBlob(async function(blob) {
                        try {
                            await navigator.clipboard.write([
                                new ClipboardItem({
                                    'image/png': blob
                                })
                            ]);
                            showSuccessMessage('✅ 图片已复制到剪贴板，可直接粘贴到社交平台！');
                        } catch (err) {
                            console.error('复制失败:', err);
                            showSuccessMessage('❌ 复制失败，请尝试下载图片');
                        }
                    }, 'image/png', 1.0);
                };
                
                img.onerror = function() {
                    console.error('SVG图片加载失败');
                    showSuccessMessage('❌ 图片生成失败，请重试');
                };
                
                img.src = url;
            } catch (err) {
                console.error('生成图片失败:', err);
                showSuccessMessage('❌ 生成图片失败，请重试');
            }
        }

        function copySVGCode() {
            try {
                const svg = document.querySelector('svg');
                const svgData = new XMLSerializer().serializeToString(svg);
                
                navigator.clipboard.writeText(svgData).then(() => {
                    showSuccessMessage('✅ SVG代码已复制到剪贴板！');
                }).catch(err => {
                    console.error('复制失败:', err);
                    showSuccessMessage('❌ 复制失败，请手动选择代码');
                });
            } catch (err) {
                console.error('复制SVG代码失败:', err);
                showSuccessMessage('❌ 复制失败，请重试');
            }
        }

        function downloadSVG() {
            try {
                const svg = document.querySelector('svg');
                const svgData = new XMLSerializer().serializeToString(svg);
                
                // Create canvas for high quality PNG
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Set high resolution
                const scale = 3;
                const svgWidth = 750;
                const svgHeight = 1334;
                
                canvas.width = svgWidth * scale;
                canvas.height = svgHeight * scale;
                
                // Set white background to ensure proper rendering
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Scale context for high resolution
                ctx.scale(scale, scale);
                
                const img = new Image();
                img.width = svgWidth;
                img.height = svgHeight;
                
                const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                
                img.onload = function() {
                    // Draw image with explicit dimensions to ensure proper scaling
                    ctx.drawImage(img, 0, 0, svgWidth, svgHeight);
                    URL.revokeObjectURL(url);
                    
                    // Download as PNG
                    canvas.toBlob(function(blob) {
                        const downloadUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = 'hitem3d-knowledge-card.png';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(downloadUrl);
                        showSuccessMessage('✅ 图片已下载到本地！');
                    }, 'image/png', 1.0);
                };
                
                img.onerror = function() {
                    console.error('SVG图片加载失败');
                    showSuccessMessage('❌ 图片生成失败，请重试');
                };
                
                img.src = url;
            } catch (err) {
                console.error('下载失败:', err);
                showSuccessMessage('❌ 下载失败，请重试');
            }
        }
