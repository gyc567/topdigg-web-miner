            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;

        .container {

            font-size: 16px;

            margin: 10px 5px;
            transition: all 0.3s ease;
            display: inline-block;

        .copy-btn:hover {

            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .copy-btn {

                padding: 10px 20px;
                min-width: 100px;
            }
            .button-container {

        .success-msg {
            color: #4CAF50;

        .success-msg.show {

</head>
<body>

                        <feOffset dx="0" dy="3" result="offsetblur" />

                        <feMerge>

                <!-- 内容区域 -->
                <rect x="75" y="300" width="600" height="950" rx="30" ry="30" fill="white" filter="url(#softShadow)" />

                <!-- Fandom标题区 -->

                <!-- 标题文本 -->
                <text x="375" y="200" font-family="'PingFang SC', sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Fandom.com</text>
                <text x="375" y="240" font-family="'PingFang SC', sans-serif" font-size="26" fill="white" text-anchor="middle">全球最大粉丝社区平台</text>
                <text x="375" y="280" font-family="'PingFang SC', sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="middle">深度分析报告 | 2025年</text>

                <!-- 功能解读区域 -->
                <g font-family="'PingFang SC', sans-serif" fill="#333333">
                    <text x="105" y="370" font-size="26" font-weight="bold">这是什么？一句话解释👇</text>
                    <rect x="105" y="390" width="540" height="80" rx="15" ry="15" fill="#F8F4FF" />
                    <text x="125" y="420" font-size="20" fill="#333">全球最大的粉丝驱动内容平台，托管25万个</text>
                    <text x="125" y="450" font-size="20" fill="#333">wiki社区，月访问量超3.15亿用户</text>
                    
                    <!-- 核心数据特色 -->
                    <text x="105" y="510" font-size="26" font-weight="bold">📊 核心数据亮点</text>
                    
                    <!-- 数据点1 -->
                    <rect x="105" y="535" width="255" height="110" rx="20" ry="20" fill="#E0F2FE" />
                    <text x="232.5" y="565" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">月活用户</text>
                    <text x="232.5" y="590" font-size="32" font-weight="bold" fill="#0EA5E9" text-anchor="middle">3.15亿</text>
                    <text x="232.5" y="615" font-size="16" fill="#666" text-anchor="middle">全球排名#36</text>
                    
                    <!-- 数据点2 -->
                    <rect x="390" y="535" width="255" height="110" rx="20" ry="20" fill="#F0FDF4" />
                    <text x="517.5" y="565" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Wiki社区</text>
                    <text x="517.5" y="590" font-size="32" font-weight="bold" fill="#22C55E" text-anchor="middle">25万+</text>
                    <text x="517.5" y="615" font-size="16" fill="#666" text-anchor="middle">4000万页面</text>
                    
                    <!-- 数据点3 -->
                    <rect x="105" y="665" width="255" height="110" rx="20" ry="20" fill="#FFF7ED" />
                    <text x="232.5" y="695" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">年收入规模</text>
                    <text x="232.5" y="720" font-size="32" font-weight="bold" fill="#F97316" text-anchor="middle">1.4亿美元</text>
                    <text x="232.5" y="745" font-size="16" fill="#666" text-anchor="middle">广告变现</text>
                    
                    <!-- 数据点4 -->
                    <rect x="390" y="665" width="255" height="110" rx="20" ry="20" fill="#FDF2F8" />
                    <text x="517.5" y="695" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">内容覆盖</text>
                    <text x="517.5" y="720" font-size="32" font-weight="bold" fill="#EC4899" text-anchor="middle">80种</text>
                    <text x="517.5" y="745" font-size="16" fill="#666" text-anchor="middle">多语言支持</text>

                    <!-- 商业模式 -->
                    <text x="105" y="820" font-size="26" font-weight="bold">💰 核心商业模式</text>
                    <rect x="105" y="840" width="540" height="160" rx="15" ry="15" fill="#F8FAFC" />
                    
                    <text x="125" y="870" font-size="20" fill="#333">📺 广告收入：程序化广告+原生广告</text>
                    <text x="125" y="900" font-size="20" fill="#333">📊 数据业务：用户行为+趋势分析</text>
                    <text x="125" y="930" font-size="20" fill="#333">🤝 内容授权：API授权+IP合作</text>
                    <text x="125" y="960" font-size="20" fill="#333">🎯 社区驱动：UGC+网络效应</text>
                    <text x="125" y="990" font-size="20" fill="#333">⭐ 综合评分：8.9/10 优秀平台</text>

                    <!-- 竞争优势 -->
                    <text x="105" y="1040" font-size="26" font-weight="bold">🏆 核心竞争优势</text>
                    <rect x="105" y="1060" width="540" height="120" rx="15" ry="15" fill="#F0FDF4" />
                    
                    <text x="125" y="1090" font-size="20" fill="#333">• 娱乐内容领域无可替代的深度和权威性</text>
                    <text x="125" y="1120" font-size="20" fill="#333">• 强大的社区网络效应和用户粘性</text>
                    <text x="125" y="1150" font-size="20" fill="#333">• 成熟的商业模式和稳定的收入流</text>

                    <!-- 网站链接 -->
                    <text x="105" y="1210" font-size="22" font-weight="bold">🔗 完整分析报告</text>
                    <rect x="105" y="1230" width="540" height="50" rx="15" ry="15" fill="#EEF2FF" />
                    <text x="125" y="1260" font-size="18" fill="#4F46E5">topdigg.com - 专业平台分析与评测</text>
                </g>
            </svg>
        </div>

        <div class="button-container">
            <button class="copy-btn" onclick="copySVGAsImage()">📋 一键复制图片</button>
            <button class="copy-btn" onclick="copySVGCode()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">📄 复制代码</button>
            <button class="copy-btn" onclick="downloadSVG()" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">💾 下载图片</button>
        </div>
        <div class="success-msg" id="successMsg">✅ SVG图片已复制到剪贴板！可直接粘贴到小红书或其他平台</div>
    </div>

    <script>
        // 复制SVG作为图片到剪贴板
        async function copySVGAsImage() {
            try {
                const svg = document.getElementById('knowledgeCard');
                const svgString = new XMLSerializer().serializeToString(svg);
                
                // 创建Canvas并将SVG绘制到Canvas上
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置Canvas尺寸（使用2倍尺寸以提高清晰度）
                const scale = 2;
                canvas.width = 750 * scale;
                canvas.height = 1334 * scale;
                ctx.scale(scale, scale);
                
                // 创建Image对象
                const img = new Image();
                const svgBlob = new Blob([svgString], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(svgBlob);
                
                img.onload = async function() {
                    // 绘制SVG到Canvas
                    ctx.drawImage(img, 0, 0, 750, 1334);
                    
                    // 将Canvas转换为Blob
                    canvas.toBlob(async function(blob) {
                        try {
                            // 使用Clipboard API复制图片
                            await navigator.clipboard.write([
                                new ClipboardItem({
                                    'image/png': blob
                                })
                            ]);
                            
                            showSuccessMessage('✅ SVG图片已复制到剪贴板！可直接粘贴到小红书、微信等平台');
                        } catch (err) {
                            console.error('复制图片失败:', err);
                            // 回退到下载方案
                            downloadImageFromCanvas(canvas, 'fandom-knowledge-card.png');
                            showSuccessMessage('⚠️ 无法直接复制，已自动下载图片文件');
                        }
                    }, 'image/png', 0.9);
                    
                    // 清理URL对象
                    URL.revokeObjectURL(url);
                };
                
                img.onerror = function() {
                    console.error('SVG加载失败');
                    showSuccessMessage('❌ 图片生成失败，请尝试复制SVG代码');
                };
                
                img.src = url;
                
            } catch (err) {
                console.error('复制失败:', err);
                showSuccessMessage('❌ 复制失败，请尝试其他浏览器或复制SVG代码');
            }
        }

        // 复制SVG代码到剪贴板
        async function copySVGCode() {
            try {
                const svg = document.getElementById('knowledgeCard');
                const svgString = new XMLSerializer().serializeToString(svg);
                
                await navigator.clipboard.writeText(svgString);
                showSuccessMessage('✅ SVG代码已复制到剪贴板！');
                
            } catch (err) {
                // 回退到传统方法
                const textArea = document.createElement('textarea');
                textArea.value = svgString;
                document.body.appendChild(textArea);
                textArea.select();
                
                try {
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showSuccessMessage('✅ SVG代码已复制到剪贴板！');
                } catch (err2) {
                    console.error('复制失败:', err2);
                    showSuccessMessage('❌ 复制失败，请手动选择SVG内容');
                }
            }
        }

        // 下载SVG为PNG图片
        function downloadSVG() {
            const svg = document.getElementById('knowledgeCard');
            const svgString = new XMLSerializer().serializeToString(svg);
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 设置高分辨率
            const scale = 3;
            canvas.width = 750 * scale;
            canvas.height = 1334 * scale;
            ctx.scale(scale, scale);
            
            const img = new Image();
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0, 750, 1334);
                downloadImageFromCanvas(canvas, 'fandom-knowledge-card.png');
                URL.revokeObjectURL(url);
                showSuccessMessage('✅ 图片已下载！文件名：fandom-knowledge-card.png');
            };
            
            img.src = url;
        }

        // 从Canvas下载图片
        function downloadImageFromCanvas(canvas, filename) {
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/png', 0.9);
        }

        // 显示成功消息
        function showSuccessMessage(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = message;
            successMsg.classList.add('show');
            
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 4000);
        }

        // 检查浏览器支持
        window.addEventListener('load', function() {
            if (!navigator.clipboard) {
                showSuccessMessage('ℹ️ 当前浏览器可能不支持直接复制图片，建议使用下载功能');
            }
        });
    </script>
</body>
</html>
