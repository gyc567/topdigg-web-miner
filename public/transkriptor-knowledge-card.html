        <div class="button-container">

    <script>
        // 复制SVG作为图片到剪贴板
        async function copySVGAsImage() {
            try {
                const svg = document.getElementById('knowledgeCard');
                const svgString = new XMLSerializer().serializeToString(svg);
                
                // 创建Canvas并将SVG绘制到Canvas上
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置Canvas尺寸（使用2倍尺寸以提高清晰度）
                const scale = 2;
                canvas.width = 750 * scale;
                canvas.height = 1334 * scale;
                ctx.scale(scale, scale);
                
                // 创建Image对象
                const img = new Image();
                const svgBlob = new Blob([svgString], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(svgBlob);
                
                img.onload = async function() {
                    // 绘制SVG到Canvas
                    ctx.drawImage(img, 0, 0, 750, 1334);
                    
                    // 将Canvas转换为Blob
                    canvas.toBlob(async function(blob) {
                        try {
                            // 使用Clipboard API复制图片
                            await navigator.clipboard.write([
                                new ClipboardItem({
                                    'image/png': blob
                                })
                            ]);
                            
                            showSuccessMessage('✅ SVG图片已复制到剪贴板！可直接粘贴到小红书、微信等平台');
                        } catch (err) {
                            console.error('复制图片失败:', err);
                            // 回退到下载方案
                            downloadImageFromCanvas(canvas, 'transkriptor-knowledge-card.png');
                            showSuccessMessage('⚠️ 无法直接复制，已自动下载图片文件');
                        }
                    }, 'image/png', 0.9);
                    
                    // 清理URL对象
                    URL.revokeObjectURL(url);
                };
                
                img.onerror = function() {
                    console.error('SVG加载失败');
                    showSuccessMessage('❌ 图片生成失败，请尝试复制SVG代码');
                };
                
                img.src = url;
                
            } catch (err) {
                console.error('复制失败:', err);
                showSuccessMessage('❌ 复制失败，请尝试其他浏览器或复制SVG代码');
            }
        }

        // 复制SVG代码到剪贴板
        async function copySVGCode() {
            try {
                const svg = document.getElementById('knowledgeCard');
                const svgString = new XMLSerializer().serializeToString(svg);
                
                await navigator.clipboard.writeText(svgString);
                showSuccessMessage('✅ SVG代码已复制到剪贴板！');
                
            } catch (err) {
                // 回退到传统方法
                const textArea = document.createElement('textarea');
                textArea.value = svgString;
                document.body.appendChild(textArea);
                textArea.select();
                
                try {
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showSuccessMessage('✅ SVG代码已复制到剪贴板！');
                } catch (err2) {
                    console.error('复制失败:', err2);
                    showSuccessMessage('❌ 复制失败，请手动选择SVG内容');
                }
            }
        }

        // 下载SVG为PNG图片
        function downloadSVG() {
            const svg = document.getElementById('knowledgeCard');
            const svgString = new XMLSerializer().serializeToString(svg);
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 设置高分辨率
            const scale = 3;
            canvas.width = 750 * scale;
            canvas.height = 1334 * scale;
            ctx.scale(scale, scale);
            
            const img = new Image();
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0, 750, 1334);
                downloadImageFromCanvas(canvas, 'transkriptor-knowledge-card.png');
                URL.revokeObjectURL(url);
                showSuccessMessage('✅ 图片已下载！文件名：transkriptor-knowledge-card.png');
            };
            
            img.src = url;
        }

        // 从Canvas下载图片
        function downloadImageFromCanvas(canvas, filename) {
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/png', 0.9);
        }

        // 显示成功消息
        function showSuccessMessage(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = message;
            successMsg.classList.add('show');
            
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 4000);
        }

        // 检查浏览器支持
        window.addEventListener('load', function() {
            if (!navigator.clipboard) {
                showSuccessMessage('ℹ️ 当前浏览器可能不支持直接复制图片，建议使用下载功能');
            }
        });
    </script>
