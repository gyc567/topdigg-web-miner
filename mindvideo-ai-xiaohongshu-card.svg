    <circle cx="120" cy="885" r="8" fill="#FF6BB6" />
    <text x="140" y="893" font-size="18" fill="#2D5A3D" font-weight="500">多模型选择：可选择最适合的AI引擎</text>
    
    <circle cx="120" cy="920" r="8" fill="#9B59B6" />
    <text x="140" y="928" font-size="18" fill="#2D5A3D" font-weight="500">隐私保护：承诺不收集用户个人信息</text>

    <!-- 适合人群 -->
    <text x="90" y="980" font-size="22" font-weight="bold" fill="#20BF7A">👥 谁最适合用？</text>
    <rect x="90" y="1000" width="570" height="120" rx="15" ry="15" fill="#F8FFF8" stroke="#20BF7A" stroke-width="1" opacity="0.6" />
    
    <text x="110" y="1030" font-size="17" fill="#2D5A3D">🎬 内容创作者：TikTok、小红书、B站UP主</text>
    <text x="110" y="1055" font-size="17" fill="#2D5A3D">💼 营销从业者：需要制作宣传和推广视频</text>
    <text x="110" y="1080" font-size="17" fill="#2D5A3D">👤 个人用户：制作纪念视频、创意内容</text>
    <text x="110" y="1105" font-size="17" fill="#2D5A3D">🏢 小型企业：低成本制作产品介绍视频</text>

    <!-- 评分和推荐 -->
    <text x="90" y="1155" font-size="22" font-weight="bold" fill="#20BF7A">⭐ 综合评分</text>
    <rect x="90" y="1175" width="570" height="50" rx="15" ry="15" fill="#E8F9F0" stroke="#20BF7A" stroke-width="2" />
    <text x="375" y="1205" font-size="24" font-weight="bold" fill="#20BF7A" text-anchor="middle">8.3/10 分 - 值得关注和使用 ⭐⭐⭐⭐⭐</text>
  </g>

  <!-- 底部品牌信息 -->
  <rect x="60" y="1240" width="630" height="60" rx="15" ry="15" fill="#20BF7A" opacity="0.1" />
  <text x="375" y="1260" font-family="'LXGW WenKai', 'PingFang SC', sans-serif" font-size="14" fill="#1A6B3A" text-anchor="middle" opacity="0.7">💡 更多AI工具评测，关注我的账号</text>
  <text x="375" y="1285" font-family="'LXGW WenKai', 'PingFang SC', sans-serif" font-size="16" fill="#20BF7A" text-anchor="middle" font-weight="bold">#AI视频生成 #MindVideoAI #免费工具 #内容创作</text>
</svg>