<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" width="750" height="1334">
  <!-- 定义渐变和阴影 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F8FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20BF7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A9B6B;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="3" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 主背景 -->
  <rect width="750" height="1334" fill="url(#bgGradient)" />

  <!-- 装饰元素：几何形状 -->
  <circle cx="80" cy="150" r="60" fill="#20BF7A" opacity="0.15" />
  <circle cx="670" cy="180" r="80" fill="#1A9B6B" opacity="0.12" />
  <circle cx="150" cy="1200" r="70" fill="#52C498" opacity="0.1" />
  <circle cx="620" cy="1150" r="90" fill="#20BF7A" opacity="0.08" />
  
  <!-- 装饰星星 -->
  <text x="100" y="100" font-size="20" fill="#20BF7A" opacity="0.6">✨</text>
  <text x="650" y="120" font-size="16" fill="#1A9B6B" opacity="0.7">⭐</text>
  <text x="200" y="1280" font-size="18" fill="#52C498" opacity="0.5">✨</text>

  <!-- 内容区域 -->
  <rect x="60" y="280" width="630" height="950" rx="30" ry="30" fill="white" filter="url(#softShadow)" opacity="0.95" />

  <!-- 标题区域 -->
  <rect x="60" y="140" width="630" height="180" rx="30" ry="30" fill="url(#headerGradient)" filter="url(#softShadow)" />

  <!-- AI视频图标 -->
  <circle cx="150" cy="230" r="25" fill="white" opacity="0.2" />
  <text x="150" y="240" font-size="24" fill="white" text-anchor="middle">🎬</text>

  <!-- 标题文本 -->
  <text x="200" y="210" font-family="'LXGW WenKai', 'PingFang SC', sans-serif" font-size="36" font-weight="bold" fill="white">MindVideo AI</text>
  <text x="200" y="250" font-family="'LXGW WenKai', 'PingFang SC', sans-serif" font-size="20" fill="white" opacity="0.9">2025年最值得关注的免费AI视频生成神器</text>
  <text x="600" y="290" font-family="'LXGW WenKai', 'PingFang SC', sans-serif" font-size="16" fill="white" opacity="0.8" text-anchor="end">AI视频制作新纪元</text>

  <!-- 技术解读区域 -->
  <g font-family="'Noto Sans SC', 'PingFang SC', sans-serif" fill="#333333">
    <text x="90" y="340" font-size="22" font-weight="bold" fill="#20BF7A">这是什么？一句话了解 👇</text>
    <rect x="90" y="350" width="570" height="65" rx="15" ry="15" fill="#F0FFF4" stroke="#20BF7A" stroke-width="1" opacity="0.8" />
    <text x="110" y="385" font-size="19" fill="#2D5A3D" font-weight="500">一个整合多个顶级AI模型的免费视频生成平台</text>
    <text x="110" y="405" font-size="19" fill="#2D5A3D" font-weight="500">让你轻松将文字和图片变成高质量视频</text>
    
    <!-- 核心亮点 -->
    <text x="90" y="450" font-size="22" font-weight="bold" fill="#20BF7A">✨ 有多厉害？</text>
    
    <!-- 亮点1 -->
    <rect x="90" y="470" width="270" height="100" rx="20" ry="20" fill="#E8F9F0" stroke="#20BF7A" stroke-width="1" opacity="0.9" />
    <text x="225" y="500" font-size="18" font-weight="bold" fill="#1A6B3A" text-anchor="middle">完全免费使用</text>
    <text x="225" y="530" font-size="28" font-weight="bold" fill="#20BF7A" text-anchor="middle">0成本</text>
    <text x="225" y="550" font-size="14" fill="#1A6B3A" text-anchor="middle" opacity="0.8">无需付费订阅</text>
    
    <!-- 亮点2 -->
    <rect x="390" y="470" width="270" height="100" rx="20" ry="20" fill="#FFF8E8" stroke="#FFB366" stroke-width="1" opacity="0.9" />
    <text x="525" y="500" font-size="18" font-weight="bold" fill="#B8860B" text-anchor="middle">视频分辨率</text>
    <text x="525" y="530" font-size="28" font-weight="bold" fill="#FFB366" text-anchor="middle">最高4K</text>
    <text x="525" y="550" font-size="14" fill="#B8860B" text-anchor="middle" opacity="0.8">专业级画质</text>
    
    <!-- 亮点3 -->
    <rect x="90" y="590" width="270" height="100" rx="20" ry="20" fill="#F0F8FF" stroke="#6BB6FF" stroke-width="1" opacity="0.9" />
    <text x="225" y="620" font-size="18" font-weight="bold" fill="#1E4A72" text-anchor="middle">AI模型数量</text>
    <text x="225" y="650" font-size="28" font-weight="bold" fill="#6BB6FF" text-anchor="middle">5+顶级</text>
    <text x="225" y="670" font-size="14" fill="#1E4A72" text-anchor="middle" opacity="0.8">Kling AI等</text>
    
    <!-- 亮点4 -->
    <rect x="390" y="590" width="270" height="100" rx="20" ry="20" fill="#FFF0F8" stroke="#FF6BB6" stroke-width="1" opacity="0.9" />
    <text x="525" y="620" font-size="18" font-weight="bold" fill="#8B1538" text-anchor="middle">生成速度</text>
    <text x="525" y="650" font-size="28" font-weight="bold" fill="#FF6BB6" text-anchor="middle">即时生成</text>
    <text x="525" y="670" font-size="14" fill="#8B1538" text-anchor="middle" opacity="0.8">无需排队等待</text>

    <!-- 核心功能 -->
